<?xml version="1.0" encoding="UTF-8"?>
<!--
  FlowCanvas 空态插画（空数据 / 请求异常共用）
  · viewBox 已裁到可见内容边界，故「高 240」即真实可见高度，宽高比 1.35
  · 六个 CSS 变量可换肤；默认值取 07 §2.4 主色七阶，改主题时同步
      --nd-paper-light  colorPrimaryBgHover      阶 2
      --nd-paper        colorPrimaryBorder       阶 3
      --nd-paper-dark   colorPrimaryBorderHover  阶 4
      --nd-arrow        colorPrimary             阶 6
      --nd-shadow       colorPrimaryBgHover      阶 2
      --nd-detail       白
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="109 67 842 627" role="img"
     aria-labelledby="nd-title nd-desc" class="fc-empty-illustration">
  <title id="nd-title">暂无数据</title>
  <desc id="nd-desc">一卷空白文档，一条虚线绕圈后向右上方扬起，末端为箭头。</desc>

  <defs>
    <linearGradient id="nd-paper-gradient" gradientUnits="userSpaceOnUse" x1="300" y1="314" x2="648" y2="684">
      <stop offset="0" stop-color="var(--nd-paper-light, #D5C6B2)"/>
      <stop offset="0.55" stop-color="var(--nd-paper, #BCA58A)"/>
      <stop offset="1" stop-color="var(--nd-paper-dark, #A28869)"/>
    </linearGradient>
    <linearGradient id="nd-roll-gradient" gradientUnits="userSpaceOnUse" x1="233" y1="351" x2="350" y2="468">
      <stop offset="0" stop-color="var(--nd-paper-dark, #A28869)"/>
      <stop offset="1" stop-color="var(--nd-arrow, #8A6F52)"/>
    </linearGradient>
    <radialGradient id="nd-shadow-gradient" gradientUnits="userSpaceOnUse" cx="405" cy="590" r="300">
      <stop offset="0" stop-color="var(--nd-shadow, #D5C6B2)" stop-opacity="0.48"/>
      <stop offset="1" stop-color="var(--nd-shadow, #D5C6B2)" stop-opacity="0.12"/>
    </radialGradient>
  </defs>

  <!-- 背景透明，不画底色 -->
  <path d="M144 566C205 535 300 530 380 548C464 528 576 536 647 570C689 590 694 617 660 638C607 671 507 684 418 666C329 681 229 665 165 631C123 609 115 581 144 566Z"
        fill="url(#nd-shadow-gradient)"/>

  <!-- 虚线轨迹画在纸后。入口段（绕圈之前）比出口段短：起点自 (592,369) 沿曲线
       前移 56 单位 = 2 个虚线周期（dasharray 14,14），用 de Casteljau 在 t=0.315
       处切分原曲线，控制点同步重算，故曲线形状不变、只是变短 -->
  <path d="M647 355C685 341 719 321 751 298C779 278 791 252 786 225C781 196 759 181 736 190C712 200 706 226 720 247C736 271 765 274 792 260C834 238 865 205 889 170C903 149 914 126 925 104"
        fill="none" stroke="var(--nd-arrow, #8A6F52)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14,14"/>
  <path d="M945 73L937 118L905 98Z" fill="var(--nd-arrow, #8A6F52)"
        stroke="var(--nd-arrow, #8A6F52)" stroke-width="3" stroke-linejoin="round"/>

  <!-- 主体卷纸 -->
  <path d="M300 351C374 333 445 316 515 314C555 313 580 337 591 370C605 421 596 504 600 553C604 594 623 619 648 640C588 672 508 688 411 684C354 681 320 650 309 605C293 543 298 431 300 351Z"
        fill="url(#nd-paper-gradient)"/>
  <path d="M300 351C372 334 444 317 515 314C553 313 578 334 590 367L594 397C511 373 416 377 345 400C339 376 322 359 300 351Z"
        fill="var(--nd-paper-light, #D5C6B2)" fill-opacity="0.68"/>

  <!-- 左侧卷边 -->
  <path d="M300 351C260 357 233 383 233 416C233 451 259 470 294 468C325 466 347 447 350 420C352 391 331 359 300 351Z"
        fill="url(#nd-roll-gradient)"/>
  <path d="M298 393C325 388 346 398 350 418C354 441 332 459 298 464C309 445 308 412 298 393Z"
        fill="var(--nd-paper, #BCA58A)" fill-opacity="0.68"/>

  <!-- 空数据占位 -->
  <path d="M378 387L440 379L448 441L386 449Z" fill="var(--nd-detail, #FFFFFF)"
        fill-opacity="0.94" stroke-linejoin="round"/>
  <g fill="none" stroke="var(--nd-detail, #FFFFFF)" stroke-width="12"
     stroke-linecap="round" stroke-opacity="0.94">
    <path d="M478 381L541 373"/>
    <path d="M480 418L548 409"/>
    <path d="M383 481L555 459"/>
    <path d="M381 524L551 502"/>
    <path d="M385 566L548 545"/>
    <path d="M393 608L552 587"/>
    <path d="M406 648L560 628"/>
  </g>
</svg>
