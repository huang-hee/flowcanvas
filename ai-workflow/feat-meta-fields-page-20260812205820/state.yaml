  - node: 实现
    result: "代码审查（⚠️ 自演＝自审，可信度有限）：查出 4 处真实缺陷，均已修复并复测——
      ① MetaFieldDrawer 的 form.validateFields() rejection 未捕获，调用处 void 之 → unhandled rejection；
      ② app-settings 用 ...get() 把 zustand store 的方法一并写进 IndexedDB，函数无法结构化克隆 →
         DataCloneError，侧栏收起态静默丢失（跨会话记忆失效）；
      ③ 筛选面板的 Form.Item 用了 noStyle，而 08 §7 的行距 8 正由 Form.itemMarginBottom 承载，
         noStyle 不渲染 form-item → 那层 ConfigProvider 覆盖落空，多行时行距塌成 0；
      ④ 抽屉用 form.getFieldValue('itemType') 在渲染期读值但不订阅变更 → 改子项类型后默认值字段显隐不更新。
      lint / typecheck / build 三项全绿。"
  - node: 实现
    result: "执行测试用例：75 passed / 0 failed（core 协议 44 + 列表与浮层 14 + 编辑抽屉 11 + 外壳 6）。
